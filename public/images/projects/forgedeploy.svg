<text x="100" y="160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#c5ff41" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.2s" fill="freeze"/>$ forge deploy ./app</text><text x="100" y="190" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#e8e4df" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.2s" fill="freeze"/>-&gt; building image...</text><text x="100" y="220" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#e8e4df" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.4s" dur="0.2s" fill="freeze"/>-&gt; starting container</text><text x="100" y="250" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#c5ff41" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.9s" dur="0.2s" fill="freeze"/>$ forge ps</text><text x="100" y="280" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#e8e4df" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.2s" fill="freeze"/>app   running   :8080</text><text x="100" y="310" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#e8e4df" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.9s" dur="0.2s" fill="freeze"/>OK deployed</text>
