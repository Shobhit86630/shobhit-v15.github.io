<circle cx="92" cy="102" r="6" fill="#ff5f57"/><circle cx="112" cy="102" r="6" fill="#febc2e"/><circle cx="132" cy="102" r="6" fill="#28c840"/>
<text x="100" y="150" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#c5ff41" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.2s" fill="freeze"/>$ npx shobhit-testapi-cli</text><text x="100" y="180" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#e8e4df" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.2s" fill="freeze"/>? Method  &gt; GET</text><text x="100" y="210" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#e8e4df" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.4s" dur="0.2s" fill="freeze"/>? URL     &gt; https://api.example.com/users</text><text x="100" y="240" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#c5ff41" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.9s" dur="0.2s" fill="freeze"/>&lt;- 200 OK  (128 ms)</text><text x="100" y="270" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#e8e4df" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.2s" fill="freeze"/>{ "users": [ ... ] }</text><text x="100" y="300" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#e8e4df" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.9s" dur="0.2s" fill="freeze"/>? Save to history &gt; yes</text>
