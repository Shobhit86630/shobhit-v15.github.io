<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="API Testing CLI demo preview placeholder">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cb3837"/><stop offset="1" stop-color="#3a0e0e"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#fff" fill-opacity=".12"/></pattern></defs>
<rect width="800" height="600" fill="url(#g)"/><rect width="800" height="600" fill="url(#dots)"/>


